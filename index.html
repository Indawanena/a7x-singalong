<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #09090b;
  --surface: #141417;
  --surface-hover: #1c1c21;
  --border: #27272a;
  --text-primary: #f4f4f5;
  --text-muted: #71717a;
  --text-dimmed: rgba(244, 244, 245, 0.28);
  --accent: #ffffff;
  --accent-bar: #3f3f46;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.view {
  display: none;
  min-height: 100vh;
}
.view.active {
  display: flex;
  flex-direction: column;
}

/* Homescreen */
.home-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(9, 9, 11, 0.9);
  backdrop-filter: blur(16px);
  padding: env(safe-area-inset-top, 16px) 20px 14px;
  border-bottom: 1px solid var(--border);
}
.home-title-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.home-title {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.home-subtitle {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.btn-install {
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
}
.btn-install:active {
  transform: scale(0.95);
}
.search-input-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px 12px 40px;
  color: #fff;
  font-size: 0.92rem;
  outline: none;
}
.search-input:focus {
  border-color: #52525b;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: var(--text-muted);
}
.song-list-container {
  padding: 12px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.song-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: background 0.15s;
}
.song-card:active {
  background: var(--surface-hover);
}
.song-num {
  font-size: 0.92rem;
  font-weight: 800;
  color: var(--text-muted);
  width: 24px;
  text-align: center;
}
.song-meta-wrap {
  flex: 1;
  min-width: 0;
}
.song-card-title {
  font-size: 1.02rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-card-album {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
}
.song-card-duration {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Player / Lyrics View */
.player-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(9, 9, 11, 0.92);
  backdrop-filter: blur(20px);
  padding: env(safe-area-inset-top, 14px) 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-back {
  background: none;
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}
.btn-back:active {
  background: var(--surface);
}
.header-track-info {
  text-align: center;
  max-width: 60%;
}
.header-track-title {
  font-size: 0.95rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-track-album {
  font-size: 0.72rem;
  color: var(--text-muted);
}
.header-right-space {
  width: 64px;
}

/* Spotify-style Lyrics Stream */
.lyrics-viewport {
  flex: 1;
  padding: 60px 24px 180px;
  display: flex;
  flex-direction: column;
  gap: 26px;
  overflow-y: auto;
  scroll-behavior: smooth;
}
.lyric-line {
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.42;
  color: var(--text-dimmed);
  transition: color 0.25s ease, font-size 0.25s ease, transform 0.25s ease;
  cursor: pointer;
  border-radius: 6px;
}
.lyric-line.active {
  color: #ffffff;
  font-size: 1.68rem;
  transform: scale(1.02);
  transform-origin: left center;
  text-shadow: 0 4px 24px rgba(0,0,0,0.9);
}

/* Bottom Player Dock with Scrubber */
.player-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 80;
  background: rgba(14, 14, 17, 0.95);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  padding: 10px 24px calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.timeline-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}
.time-label {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  min-width: 34px;
}
.time-label.right {
  text-align: right;
}
.progress-bar-container {
  flex: 1;
  height: 5px;
  background: #27272a;
  border-radius: 999px;
  position: relative;
  cursor: pointer;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: #ffffff;
  border-radius: 999px;
  position: relative;
}
.dock-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dock-nav {
  display: flex;
  align-items: center;
  gap: 18px;
}
.btn-round {
  background: #ffffff;
  border: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
}
.btn-round:active {
  transform: scale(0.92);
}
.btn-step {
  background: none;
  border: none;
  color: #a1a1aa;
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
}
.btn-step:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}
.btn-speed {
  background: var(--surface);
  border: 1px solid var(--border);
  color: #d4d4d8;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
}
.btn-speed:active {
  background: var(--surface-hover);
}
</style>
</head>
<body>

<!-- VIEW 1: HOMESCREEN -->
<div class="view active" id="viewHome">
  <div class="home-header">
    <div class="home-title-bar">
      <div>
        <h1 class="home-title">Avenged Sevenfold</h1>
        <p class="home-subtitle">Asia Tour 2026 Setlist (Tempo Asli)</p>

    </div>

  <div class="song-list-container" id="homeList"></div>
</div>

<!-- VIEW 2: LYRICS PLAYER -->
<div class="view lyrics-view" id="viewLyrics">

      Back

      <div class="progress-bar-container" id="progressContainer" onclick="seekProgress(event)">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="time-label right" id="timeTotal">0:00</div>
    </div>
    <div class="dock-main">
      <div class="dock-nav">
        <button class="btn-step" id="btnPrev" onclick="prevTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"/></svg>
        </button>
        <button class="btn-round" id="btnPlay" onclick="togglePlay()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button class="btn-step" id="btnNext" onclick="nextTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"/></svg>
        </button>
      </div>
      <button class="btn-speed" id="btnSpeed" onclick="cycleSpeed()">1.0x Normal</button>
    </div>
  </div>
</div>

let currentTrackIdx = 0;
let currentTime = 0;
let isPlaying = false;
let lastTickTime = null;
let animationFrameId = null;

const SPEEDS = [
  { label: "1.0x Normal", rate: 1.0 },
  { label: "1.25x Fast", rate: 1.25 },
  { label: "1.5x Rush", rate: 1.5 },
  { label: "0.75x Slow", rate: 0.75 }
];
let speedIdx = 0;

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function renderHome(items) {
  const container = document.getElementById('homeList');
  if (items.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;font-size:0.9rem;">Lagu tidak ditemukan</div>';
    return;
  }
  container.innerHTML = items.map((s) => `
    <div class="song-card" onclick="openTrack(${s.id - 1})">
      <div class="song-num">${s.id}</div>
      <div class="song-meta-wrap">
        <div class="song-card-title">${s.title}</div>
        <div class="song-card-album">${s.album}</div>
      </div>
      <div class="song-card-duration">${formatTime(s.duration)}</div>
    </div>
  `).join('');
}

function filterHome() {
  const q = document.getElementById('homeSearch').value.toLowerCase();
  const filtered = SETLIST_DATA.filter(s => s.title.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
  renderHome(filtered);
}

function openTrack(idx) {
  currentTrackIdx = idx;
  currentTime = 0;
  stopPlay();

  const song = SETLIST_DATA[idx];
  document.getElementById('playerTitle').innerText = song.title;
  document.getElementById('playerAlbum').innerText = song.album;
  document.getElementById('timeTotal').innerText = formatTime(song.duration);
  document.getElementById('timeCurrent').innerText = "0:00";
  document.getElementById('progressFill').style.width = "0%";

  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === SETLIST_DATA.length - 1;

  const viewport = document.getElementById('playerViewport');
  viewport.innerHTML = song.lines.map((l, lIdx) => `
    <div class="lyric-line" id="line-${lIdx}" onclick="jumpToLine(${l.t}, ${lIdx})">
      ${l.text}
    </div>
  `).join('');

  document.getElementById('viewHome').classList.remove('active');
  document.getElementById('viewLyrics').classList.add('active');
  window.scrollTo(0, 0);

  updateActiveLyric(true);
}

function goToHome() {
  stopPlay();
  document.getElementById('viewLyrics').classList.remove('active');
  document.getElementById('viewHome').classList.add('active');
}

function jumpToLine(timestamp, lIdx) {
  currentTime = timestamp;
  updateUI();
  updateActiveLyric(true);
}

function seekProgress(e) {
  const rect = document.getElementById('progressContainer').getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const pct = Math.max(0, Math.min(1, clickX / rect.width));
  const song = SETLIST_DATA[currentTrackIdx];
  currentTime = pct * song.duration;
  updateUI();
  updateActiveLyric(true);
}

function updateActiveLyric(scrollIntoView = false) {
  const song = SETLIST_DATA[currentTrackIdx];
  let activeIdx = 0;
  for (let i = 0; i < song.lines.length; i++) {
    if (currentTime >= song.lines[i].t) {
      activeIdx = i;
    } else {
      break;
    }
  }

  document.querySelectorAll('.lyric-line').forEach((el, i) => {
    if (i === activeIdx) {
      if (!el.classList.contains('active')) {
        el.classList.add('active');
        if (scrollIntoView) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    } else {
      el.classList.remove('active');
    }
  });
}

let lastScrollLine = -1;
function updateUI() {
  const song = SETLIST_DATA[currentTrackIdx];
  document.getElementById('timeCurrent').innerText = formatTime(currentTime);
  const pct = Math.min(100, (currentTime / song.duration) * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  // Find active line
  let activeIdx = 0;
  for (let i = 0; i < song.lines.length; i++) {
    if (currentTime >= song.lines[i].t) activeIdx = i;
    else break;
  }

  if (activeIdx !== lastScrollLine) {
    lastScrollLine = activeIdx;
    updateActiveLyric(true);
  }
}

function tick(now) {
  if (!isPlaying) return;
  if (!lastTickTime) lastTickTime = now;
  const dt = (now - lastTickTime) / 1000;
  lastTickTime = now;

  const song = SETLIST_DATA[currentTrackIdx];
  currentTime += dt * SPEEDS[speedIdx].rate;

  if (currentTime >= song.duration) {
    currentTime = song.duration;
    updateUI();
    if (currentTrackIdx < SETLIST_DATA.length - 1) {
      openTrack(currentTrackIdx + 1);
      startPlay();
    } else {
      stopPlay();
    }
    return;
  }

  updateUI();
  animationFrameId = requestAnimationFrame(tick);
}

function togglePlay() {
  if (isPlaying) stopPlay();
  else startPlay();
}

function startPlay() {
  isPlaying = true;
  lastTickTime = null;
  document.getElementById('playIcon').outerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  animationFrameId = requestAnimationFrame(tick);
}

function stopPlay() {
  isPlaying = false;
  lastTickTime = null;
  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  const icon = document.getElementById('playIcon');
  if (icon) {
    icon.outerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="6 4 20 12 6 20 6 4"/></svg>`;
  }
}

function prevTrack() {
  if (currentTrackIdx > 0) openTrack(currentTrackIdx - 1);
}

function nextTrack() {
  if (currentTrackIdx < SETLIST_DATA.length - 1) openTrack(currentTrackIdx + 1);
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  document.getElementById('btnSpeed').innerText = SPEEDS[speedIdx].label;
}

// PWA Install Prompt & Service Worker
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('btnInstallApp');
  if (btn) btn.style.display = 'inline-flex';
});

function promptInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('btnInstallApp').style.display = 'none';
    });
  } else {
    alert("Untuk install: buka menu 3 titik di Chrome lalu pilih 'Install app' atau 'Tambahkan ke Layar Utama'.");
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=4').then(reg => {
    reg.update();
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}

renderHome(SETLIST_DATA);
</script>
