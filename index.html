<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>A7X Asia Tour 2026 • Setlist & Lyrics</title>
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A7X Lyrics">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
:root {
  --bg: #09090b;
  --surface: #141417;
  --surface-hover: #1c1c21;
  --border: #27272a;
  --text-primary: #f4f4f5;
  --text-muted: #71717a;
  --text-dimmed: rgba(244, 244, 245, 0.3);
  --accent: #e4e4e7;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* View Switcher */
.view {
  display: none;
  min-height: 100vh;
}
.view.active {
  display: flex;
  flex-direction: column;
}

/* --- HOMESCREEN --- */
.home-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(9, 9, 11, 0.88);
  backdrop-filter: blur(16px);
  padding: env(safe-area-inset-top, 16px) 20px 14px;
  border-bottom: 1px solid var(--border);
}
.home-title-bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.home-title {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.home-subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.btn-install {
  background: #ffffff;
  color: #000000;
  border: none;
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
}
.btn-install:active {
  transform: scale(0.95);
}
.search-input-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px 12px 40px;
  color: #fff;
  font-size: 0.92rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus {
  border-color: #52525b;
}
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: var(--text-muted);
}

.song-list-container {
  padding: 12px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.song-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.song-card:active {
  background: var(--surface-hover);
  border-color: #3f3f46;
}
.song-num {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text-muted);
  width: 24px;
  text-align: center;
}
.song-meta-wrap {
  flex: 1;
  min-width: 0;
}
.song-card-title {
  font-size: 1.02rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.song-card-album {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 500;
}
.chevron-right {
  width: 16px;
  height: 16px;
  stroke: var(--text-muted);
  flex-shrink: 0;
}

/* --- PLAYER / LYRICS VIEW --- */
.lyrics-view {
  background: #09090b;
  position: relative;
}
.player-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(9, 9, 11, 0.92);
  backdrop-filter: blur(20px);
  padding: env(safe-area-inset-top, 14px) 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.btn-back {
  background: none;
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}
.btn-back:active {
  background: var(--surface);
}
.header-track-info {
  text-align: center;
  max-width: 60%;
}
.header-track-title {
  font-size: 0.95rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-track-album {
  font-size: 0.72rem;
  color: var(--text-muted);
}
.header-right-space {
  width: 64px;
}

/* Spotify-style Lyrics Viewport */
.lyrics-viewport {
  flex: 1;
  padding: 40px 24px 140px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
  scroll-behavior: smooth;
}
.lyric-line {
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.4;
  color: var(--text-dimmed);
  transition: color 0.25s ease, font-size 0.25s ease, transform 0.25s ease;
  cursor: pointer;
}
.lyric-line.active {
  color: #ffffff;
  font-size: 1.65rem;
  transform: scale(1.02);
  transform-origin: left center;
}
.lyric-line.inst {
  font-size: 0.95rem;
  font-style: italic;
  color: rgba(255, 255, 255, 0.35);
}

/* Bottom Player Controls */
.player-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 80;
  background: rgba(14, 14, 17, 0.94);
  backdrop-filter: blur(24px);
  border-top: 1px solid var(--border);
  padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dock-nav {
  display: flex;
  align-items: center;
  gap: 16px;
}
.btn-round {
  background: #ffffff;
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
}
.btn-round:active {
  transform: scale(0.92);
}
.btn-step {
  background: none;
  border: none;
  color: #a1a1aa;
  cursor: pointer;
  padding: 8px;
  display: flex;
  align-items: center;
}
.btn-step:disabled {
  opacity: 0.2;
  cursor: not-allowed;
}
.btn-speed {
  background: var(--surface);
  border: 1px solid var(--border);
  color: #d4d4d8;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
}
</style>
</head>

let currentTrackIdx = 0;
let currentLineIdx = 0;
let isPlaying = false;
let playInterval = null;
const SPEEDS = [2.5, 3.5, 5.0];
let speedIdx = 1;

function renderHome(items) {
  const container = document.getElementById('homeList');
  if (items.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px;font-size:0.9rem;">Lagu tidak ditemukan</div>';
    return;
  }
  container.innerHTML = items.map((s) => `
    <div class="song-card" onclick="openTrack(${s.id - 1})">
      <div class="song-num">${s.id}</div>
      <div class="song-meta-wrap">
        <div class="song-card-title">${s.title}</div>
        <div class="song-card-album">${s.album}</div>
      </div>
      <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  `).join('');
}

function filterHome() {
  const q = document.getElementById('homeSearch').value.toLowerCase();
  const filtered = SETLIST_2026.filter(s => s.title.toLowerCase().includes(q) || s.album.toLowerCase().includes(q));
  renderHome(filtered);
}

function openTrack(idx) {
  currentTrackIdx = idx;
  currentLineIdx = 0;
  stopPlay();

  const song = SETLIST_2026[idx];
  document.getElementById('playerTitle').innerText = song.title;
  document.getElementById('playerAlbum').innerText = song.album;
  
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === SETLIST_2026.length - 1;

  const viewport = document.getElementById('playerViewport');
  viewport.innerHTML = song.lines.map((line, lIdx) => {
    const isInst = line.startsWith('[');
    return `<div class="lyric-line ${isInst ? 'inst' : ''}" id="line-${lIdx}" onclick="selectLine(${lIdx})">${line}</div>`;
  }).join('');

  document.getElementById('viewHome').classList.remove('active');
  document.getElementById('viewLyrics').classList.add('active');
  window.scrollTo(0, 0);

  selectLine(0, false);
}

function goToHome() {
  stopPlay();
  document.getElementById('viewLyrics').classList.remove('active');
  document.getElementById('viewHome').classList.add('active');
}

function selectLine(lIdx, smooth = true) {
  currentLineIdx = lIdx;
  document.querySelectorAll('.lyric-line').forEach((el, i) => {
    if (i === lIdx) el.classList.add('active');
    else el.classList.remove('active');
  });

  const activeEl = document.getElementById(`line-${lIdx}`);
  if (activeEl) {
    activeEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
  }
}

function togglePlay() {
  if (isPlaying) stopPlay();
  else startPlay();
}

function startPlay() {
  isPlaying = true;
  document.getElementById('playIcon').outerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  playInterval = setInterval(() => {
    const song = SETLIST_2026[currentTrackIdx];
    if (currentLineIdx < song.lines.length - 1) {
      selectLine(currentLineIdx + 1, true);
    } else {
      if (currentTrackIdx < SETLIST_2026.length - 1) {
        openTrack(currentTrackIdx + 1);
        startPlay();
      } else {
        stopPlay();
      }
    }
  }, SPEEDS[speedIdx] * 1000);
}

function stopPlay() {
  isPlaying = false;
  clearInterval(playInterval);
  playInterval = null;
  const icon = document.getElementById('playIcon');
  if (icon) {
    icon.outerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="6 4 20 12 6 20 6 4"/></svg>`;
  }
}

function prevTrack() {
  if (currentTrackIdx > 0) openTrack(currentTrackIdx - 1);
}

function nextTrack() {
  if (currentTrackIdx < SETLIST_2026.length - 1) openTrack(currentTrackIdx + 1);
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  document.getElementById('btnSpeed').innerText = `Speed: ${SPEEDS[speedIdx]}s`;
  if (isPlaying) {
    stopPlay();
    startPlay();
  }
}

// PWA Service Worker & Install Prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('btnInstallApp');
  if (btn) btn.style.display = 'inline-flex';
});

function promptInstall() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('btnInstallApp').style.display = 'none';
    });
  } else {
    alert("Untuk install: tap menu titik tiga di Chrome lalu pilih 'Install app' atau 'Tambahkan ke Layar Utama'.");
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

renderHome(SETLIST_2026);
</script>
